{% comment %}
Botão principal da página (estilo .btn-stage, definido no base.html).
Uso: include "components/cta.html" with label="Entrar" full=True
Opcionais: type (padrão "submit"), full (ocupa a largura toda), click (expressão Alpine para @click).
{% endcomment %}
<button type="{{ type|default:'submit' }}" class="btn-stage{% if full %} w-full{% endif %}"{% if click %} @click="{{ click }}"{% endif %}>
    <svg class="arr-2" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path></svg>
    <span class="text">{{ label }}</span>
    <span class="circle"></span>
    <svg class="arr-1" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path></svg>
</button>
