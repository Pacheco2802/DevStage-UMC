{# Aceite dos termos (LGPD) nas telas de cadastro. Uso: {% include "components/accept_lgpd.html" with field=field %} #}
<div>
    <div class="flex items-start gap-3">
        <span class="cbx">
            <input type="checkbox" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
                   {% if field.value %}checked{% endif %} required>
            <span class="check" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path d="M1,9 L1,3.5 C1,2 2,1 3.5,1 L14.5,1 C16,1 17,2 17,3.5 L17,14.5 C17,16 16,17 14.5,17 L3.5,17 C2,17 1,16 1,14.5 L1,9 Z"></path>
                    <polyline points="1 9 7 14 15 4"></polyline>
                </svg>
            </span>
        </span>
        <label for="{{ field.id_for_label }}" class="text-sm text-muted cursor-pointer">
            Li e aceito os
            <a href="{% url 'core:terms' %}" target="_blank" class="link">termos de uso</a>
            e a
            <a href="{% url 'core:privacy' %}" target="_blank" class="link">política de privacidade</a>.
        </label>
    </div>
    {% for error in field.errors %}
    <p class="err">{{ error }}</p>
    {% endfor %}
</div>
