name: CI

# Roda a cada pull request aberto, atualizado (novo push na branch) ou reaberto.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Se chegar um push novo no mesmo PR, cancela a execucao anterior.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Variaveis exigidas pelo config/settings.py (o .env nao vai para o repositorio).
# Valores ficticios, so para o ambiente de CI.
# DEBUG=True porque, com False, o settings liga cookies so-HTTPS e os testes
# com live_server (HTTP) nao conseguiriam manter a sessao de login.
env:
  SECRET_KEY: chave-ficticia-somente-para-ci
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_URL: postgres://devstage:devstage@localhost:5432/devstage

# Tres jobs sem "needs": rodam em paralelo, cada um em uma maquina limpa,
# e aparecem como tres checagens independentes no PR.
jobs:
  lint:
    name: Linter (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check .

  unit-tests:
    name: Testes unitarios
    runs-on: ubuntu-latest
    # Sem servico de banco: os testes unitarios nao podem depender dele.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/unit -v

  integration-tests:
    name: Testes de integracao
    runs-on: ubuntu-latest
    # Postgres real, o mesmo banco usado em producao.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devstage
          POSTGRES_PASSWORD: devstage
          POSTGRES_DB: devstage
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/integration -v
