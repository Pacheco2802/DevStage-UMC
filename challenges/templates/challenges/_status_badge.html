<span class="inline-flex items-center gap-1.5 font-mono text-[11px] font-semibold tracking-[0.06em] whitespace-nowrap
    {% if status == 'OPEN' %}text-light{% elif status == 'CLOSED' %}text-danger{% else %}text-muted{% endif %}">
    <span class="w-[7px] h-[7px] rounded-full bg-current" aria-hidden="true"></span>
    {{ label|upper }}
</span>
