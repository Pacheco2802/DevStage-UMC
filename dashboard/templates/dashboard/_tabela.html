<details class="mt-3 text-xs">
    <summary class="cursor-pointer text-[var(--muted-foreground)] hover:text-[var(--neon)]">Ver dados em tabela</summary>
    <table class="mt-2 w-full">
        <thead>
            <tr class="text-left text-[var(--muted-foreground)] border-b border-[var(--border)]">
                <th class="py-1 pr-4 font-medium">{{ coluna }}</th>
                <th class="py-1 font-medium text-right">Total</th>
            </tr>
        </thead>
        <tbody>
            {% for ponto in serie %}
            <tr class="border-b border-[var(--border)] last:border-0">
                <td class="py-1 pr-4">{{ ponto.label }}</td>
                <td class="py-1 text-right mono">{{ ponto.valor }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</details>
