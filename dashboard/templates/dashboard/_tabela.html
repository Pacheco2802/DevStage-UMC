<details class="mt-3 text-xs">
    <summary class="cursor-pointer text-muted hover:text-light transition-colors">Ver dados em tabela</summary>
    <table class="mt-2 w-full">
        <thead>
            <tr class="text-left text-muted border-b border-line">
                <th class="py-1 pr-4 font-medium">{{ coluna }}</th>
                <th class="py-1 font-medium text-right">Total</th>
            </tr>
        </thead>
        <tbody>
            {% for ponto in serie %}
            <tr class="border-b border-line last:border-0">
                <td class="py-1 pr-4">{{ ponto.label }}</td>
                <td class="py-1 text-right font-mono">{{ ponto.valor }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</details>
